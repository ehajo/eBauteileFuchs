[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ebauteilefuchs"
version = "0.1.0.dev0"
description = "Lokale Lagerverwaltung für Elektronikbauteile und Bastellager"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "eHaJo" }]
keywords = ["inventory", "electronics", "maker", "fastapi", "sqlite"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
ebauteilefuchs = "ebauteilefuchs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebauteilefuchs = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ebauteilefuchs"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ebauteilefuchs"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ebauteilefuchs"
dynamic = ["version"]
description = "Lokale Lagerverwaltung für Elektronikbauteile und Bastellager"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "eHaJo" }]
keywords = ["inventory", "electronics", "maker", "fastapi", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Inventory",
]

dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qrcode[pil]>=8.2,<9",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/eHaJo/eBauteileFuchs"
Documentation = "https://github.com/eHaJo/eBauteileFuchs#readme"
Repository = "https://github.com/eHaJo/eBauteileFuchs"
Issues = "https://github.com/eHaJo/eBauteileFuchs/issues"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
ebauteilefuchs = "ebauteilefuchs.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ebauteilefuchs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebauteilefuchs = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ebauteilefuchs"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ebauteilefuchs"]
